        <!-- Scenario Selection -->
        <div class="scenario-tabs">
            <button class="tab-button active" onclick="selectScenario('complaint')">
                📱 Online Complaint

            <button class="tab-button" onclick="selectScenario('character')">

            <button class="tab-button" onclick="selectScenario('senior')">
                👴 Senior Citizen Certificate

        <!-- Animation Canvas -->

                <defs>
                    <!-- Filters -->
                    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
                        <feOffset dx="2" dy="4" result="offsetblur" />
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.3" />
                        </feComponentTransfer>
                        <feMerge>
                            <feMergeNode />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>

                    <filter id="glow">
                        <feGaussianBlur stdDeviation="4" result="coloredBlur" />
                        <feMerge>
                            <feMergeNode in="coloredBlur" />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>

                    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#B0E0E6;stop-opacity:1" />
                    </linearGradient>

                    <linearGradient id="skinTone" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#FFDBAC;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#F1C27D;stop-opacity:1" />
                    </linearGradient>

                    <linearGradient id="khakiUniform" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#C9B382;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#A89160;stop-opacity:1" />
                    </linearGradient>
                </defs>

                <!-- Background -->

                    <g opacity="0.6">

                            values="M -22,5 Q -32,15 -34,22; M -22,5 Q -28,12 -28,25; M -22,5 Q -32,15 -34,22"
                            dur="0.8s" repeatCount="indefinite" />
                    </path>
                    <path d="M 22,5 Q 32,15 34,22" stroke="url(#khakiUniform)" stroke-width="11" fill="none"
                        stroke-linecap="round">
                        <animate attributeName="d"
                            values="M 22,5 Q 32,15 34,22; M 22,5 Q 28,12 28,25; M 22,5 Q 32,15 34,22" dur="0.8s"
                            repeatCount="indefinite" />
                    </path>

                    <!-- Hands -->
                    <ellipse cx="-34" cy="22" rx="7" ry="9" fill="url(#skinTone)">
                        <animate attributeName="cy" values="22;25;22" dur="0.8s" repeatCount="indefinite" />
                    </ellipse>
                    <ellipse cx="34" cy="22" rx="7" ry="9" fill="url(#skinTone)">
                        <animate attributeName="cy" values="22;25;22" dur="0.8s" repeatCount="indefinite" />
                    </ellipse>

                    <!-- Legs walking -->
                    <path d="M -8,44 L -14,52" stroke="#424242" stroke-width="12" stroke-linecap="round">
                        <animate attributeName="d" values="M -8,44 L -14,52; M -8,44 L -18,52; M -8,44 L -14,52"
                            dur="0.8s" repeatCount="indefinite" />
                    </path>
                    <path d="M 8,44 L 14,52" stroke="#424242" stroke-width="12" stroke-linecap="round">
                        <animate attributeName="d" values="M 8,44 L 14,52; M 8,44 L 8,52; M 8,44 L 14,52" dur="0.8s"
                            repeatCount="indefinite" />
                    </path>

                    <!-- Animation path -->
                    <animateMotion dur="16s" repeatCount="indefinite" begin="5s">
                        <mpath href="#walkPath" />
                    </animateMotion>
                </g>

                <path id="walkPath" d="M 1385,442 L 800,442 L 220,442 L 220,442 L 800,442 L 1385,442 Z" fill="none"
                    stroke="none" />

                <!-- BIDIRECTIONAL DATA FLOW -->
                <g id="dataFlow">
                    <!-- Request going to police (Home → Police) -->
                    <g id="requestPacket">
                        <circle cx="0" cy="0" r="12" fill="#2196F3" opacity="0" filter="url(#glow)">
                            <animate id="requestAnim" attributeName="opacity" values="0;0.9;0.9;0.9;0" dur="16s"
                                keyTimes="0;0.05;0.2;0.35;0.4" repeatCount="indefinite" begin="2s" />
                        </circle>
                        <text x="0" y="6" text-anchor="middle" font-size="12" fill="white" font-weight="bold"
                            opacity="0">
                            <animate attributeName="opacity" values="0;0.9;0.9;0.9;0" dur="16s"
                                keyTimes="0;0.05;0.2;0.35;0.4" repeatCount="indefinite" begin="2s" />
                            📄
                        </text>
                        <text x="0" y="-18" text-anchor="middle" font-size="10" fill="#1565C0" font-weight="bold"
                            opacity="0">
                            <animate attributeName="opacity" values="0;0.9;0.9;0.9;0" dur="16s"
                                keyTimes="0;0.05;0.2;0.35;0.4" repeatCount="indefinite" begin="2s" />
                            REQUEST
                        </text>
                        <animateMotion dur="16s" repeatCount="indefinite" begin="2s" keyPoints="0;0;0.5;1;1"
                            keyTimes="0;0.05;0.2;0.35;0.4" calcMode="linear">
                            <mpath href="#requestPath" />
                        </animateMotion>
                    </g>

                    <!-- Approval coming back (Police → Home) -->
                    <g id="approvalPacket">
                        <circle cx="0" cy="0" r="12" fill="#4CAF50" opacity="0" filter="url(#glow)">
                            <animate id="approvalAnim" attributeName="opacity" values="0;0;0;0.9;0.9;0.9;0" dur="16s"
                                keyTimes="0;0.5;0.55;0.7;0.85;0.9;1" repeatCount="indefinite" begin="2s" />
                        </circle>
                        <text x="0" y="6" text-anchor="middle" font-size="14" fill="white" font-weight="bold"
                            opacity="0">
                            <animate attributeName="opacity" values="0;0;0;0.9;0.9;0.9;0" dur="16s"
                                keyTimes="0;0.5;0.55;0.7;0.85;0.9;1" repeatCount="indefinite" begin="2s" />
                            ✓
                        </text>
                        <text x="0" y="-18" text-anchor="middle" font-size="10" fill="#2E7D32" font-weight="bold"
                            opacity="0">
                            <animate attributeName="opacity" values="0;0;0;0.9;0.9;0.9;0" dur="16s"
                                keyTimes="0;0.5;0.55;0.7;0.85;0.9;1" repeatCount="indefinite" begin="2s" />
                            APPROVED
                        </text>
                        <animateMotion dur="16s" repeatCount="indefinite" begin="2s" keyPoints="0;0;0;0.5;1;1;1"
                            keyTimes="0;0.5;0.55;0.7;0.85;0.9;1" calcMode="linear">
                            <mpath href="#approvalPath" />
                        </animateMotion>
                    </g>

                    <!-- WiFi signals -->
                    <g id="wifiWaves">
                        <path d="M 250,270 Q 280,240 310,270" stroke="#4CAF50" stroke-width="3" fill="none"
                            opacity="0.5" stroke-linecap="round">
                            <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.5s" repeatCount="indefinite" />
                        </path>
                        <path d="M 235,285 Q 280,225 325,285" stroke="#4CAF50" stroke-width="3" fill="none"
                            opacity="0.3" stroke-linecap="round">
                            <animate attributeName="opacity" values="0.1;0.5;0.1" dur="2.5s" repeatCount="indefinite"
                                begin="0.5s" />
                        </path>
                    </g>
                </g>

                <!-- Paths for data flow -->
                <path id="requestPath" d="M 270,280 Q 800,200 1385,320" fill="none" stroke="none" />
                <path id="approvalPath" d="M 1385,320 Q 800,200 270,280" fill="none" stroke="none" />

                <!-- SUCCESS DOWNLOAD INDICATOR -->
                <g id="downloadSuccess" opacity="0">
                    <circle cx="220" cy="310" r="42" fill="#4CAF50" filter="url(#glow)" />
                    <circle cx="220" cy="310" r="34" fill="#66BB6A" />
                    <text x="220" y="332" text-anchor="middle" font-size="48" fill="white" font-weight="bold">✓</text>
                    <text x="220" y="362" text-anchor="middle" font-size="17" font-weight="bold"
                        fill="#1B5E20">CERTIFICATE</text>
                    <text x="220" y="380" text-anchor="middle" font-size="15" fill="#2E7D32">READY</text>
                </g>
            </svg>
        </div>

        <!-- Controls -->
        <div class="controls-panel">
            <button class="control-btn" onclick="restartAnimation()">🔄 Restart</button>
            <button class="control-btn" onclick="toggleAnimation()">⏯️ Pause/Play</button>
            <button class="control-btn" onclick="changeSpeed('slow')">🐢 Slow</button>
            <button class="control-btn" onclick="changeSpeed('normal')">▶️ Normal</button>
            <button class="control-btn" onclick="changeSpeed('fast')">⚡ Fast</button>
        </div>

        <!-- Status Display -->
        <div class="info-panel">
            <div class="status-display">
                <div class="status-header">
                    <div class="status-icon" id="statusIcon">📱</div>
                    <div class="status-text">
                        <h3 id="statusTitle">Citizen applying from home</h3>
                        <p id="statusDetail">Filing online complaint via mobile app</p>
                    </div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressBar" style="width: 0%"></div>
                </div>
            </div>

            <!-- <div class="legend-grid">
                <div class="legend-item">📱 Mobile App - File complaint from home</div>
                <div class="legend-item">💻 Laptop - Senior citizen certificate</div>
                <div class="legend-item">📤 Blue Packet - Request sent to station</div>
                <div class="legend-item">✅ Green Packet - Approval sent back home</div>
                <div class="legend-item">👮 Physical Verification - Officer visits</div>
                <div class="legend-item">🖥️ Police Desktop - Process applications</div>
            </div> -->
        </div>

        <!-- Footer -->
        <div class="footer">
            <strong>Odisha Police</strong> - Smart Policing, Digital Services | सत्यमेव जयते | ସତ୍ୟମେବ ଜୟତେ
        </div>
    </div>

    <script>
        let isPaused = false;
        let currentScenario = 'complaint';
        let currentSpeed = 'normal';
        let animationStartTime;
        let statusInterval;

        const speeds = { slow: 20000, normal: 16000, fast: 10000 };

        const scenarios = {
            complaint: {
                icon: '📱',
                messages: [
                    { progress: 0, title: "Citizen applying from home", detail: "Filing online complaint via mobile app" },
                    { progress: 12, title: "Request sent to police station", detail: "Digital application transmitted" },
                    { progress: 20, title: "Police receives complaint", detail: "Officer reviewing on desktop" },
                    { progress: 30, title: "Verification initiated", detail: "Officer assigned for follow-up" },
                    { progress: 45, title: "Officer traveling to location", detail: "Physical verification in progress" },
                    { progress: 70, title: "Verification complete", detail: "Officer returning to station" },
                    { progress: 80, title: "Approval sent back to citizen", detail: "Digitally transmitted from station" },
                    { progress: 92, title: "Case updated - Citizen notified", detail: "Status available on app" }
                ]
            },
            character: {
                icon: '📱',
                messages: [
                    { progress: 0, title: "Citizen applying from home", detail: "Character certificate via mobile" },
                    { progress: 10, title: "Request sent to police", detail: "Application transmitted digitally" },
                    { progress: 18, title: "Application received", detail: "Request in police system" },
                    { progress: 28, title: "Police reviewing request", detail: "Officer checking on desktop" },
                    { progress: 38, title: "Verification assigned", detail: "Officer dispatched for home visit" },
                    { progress: 55, title: "Officer at citizen's home", detail: "Physical verification in progress" },
                    { progress: 68, title: "Verification complete", detail: "Officer approving on system" },
                    { progress: 78, title: "Certificate approved", detail: "Approval sent back digitally" },
                    { progress: 90, title: "Certificate ready for download", detail: "Citizen can download now" }
                ]
            },
            senior: {
                icon: '💻',
                messages: [
                    { progress: 0, title: "Senior citizen at home", detail: "Opening police portal on laptop" },
                    { progress: 8, title: "Filling application form", detail: "Senior citizen certificate request" },
                    { progress: 15, title: "Request transmitted", detail: "Application sent to police station" },
                    { progress: 25, title: "Application received", detail: "Police reviewing documents" },
                    { progress: 35, title: "Home visit scheduled", detail: "Officer assigned for verification" },
                    { progress: 50, title: "Officer at senior's home", detail: "Age & residence verification" },
                    { progress: 65, title: "Verification complete", detail: "Officer confirming details" },
                    { progress: 75, title: "Certificate approved", detail: "Approval transmitted back" },
                    { progress: 88, title: "Certificate generated", detail: "Ready for instant download" },
                    { progress: 95, title: "Download available", detail: "Senior can download certificate" }
                ]
            }
        };

        function selectScenario(scenario) {
            currentScenario = scenario;

            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            const smartphone = document.getElementById('smartphone');
            const laptop = document.getElementById('laptop');
            const seniorCitizen = document.getElementById('seniorCitizen');
            const citizenDevice = document.getElementById('citizenWithDevice');

            if (scenario === 'senior') {
                citizenDevice.style.opacity = '0';
                seniorCitizen.style.opacity = '1';
            } else {
                citizenDevice.style.opacity = '1';
                seniorCitizen.style.opacity = '0';

                if (scenario === 'complaint' || scenario === 'character') {
                    smartphone.style.opacity = '1';
                    laptop.style.opacity = '0';
                }
            }

            document.getElementById('statusIcon').textContent = scenarios[scenario].icon;
            restartAnimation();
        }

        function updateStatus() {
            const duration = speeds[currentSpeed];
            animationStartTime = Date.now();

            clearInterval(statusInterval);

            statusInterval = setInterval(() => {
                if (isPaused) return;

                const elapsed = Date.now() - animationStartTime;
                const progress = Math.min(((elapsed % duration) / duration) * 100, 100);

                document.getElementById('progressBar').style.width = progress + '%';

                const messages = scenarios[currentScenario].messages;
                let currentMsg = messages[0];

                for (let msg of messages) {
                    if (progress >= msg.progress) currentMsg = msg;
                }

                document.getElementById('statusTitle').textContent = currentMsg.title;
                document.getElementById('statusDetail').textContent = currentMsg.detail;

                const downloadEl = document.getElementById('downloadSuccess');
                if (progress >= 88 && (currentScenario === 'character' || currentScenario === 'senior')) {
                    downloadEl.setAttribute('opacity', '1');
                } else {
                    downloadEl.setAttribute('opacity', '0');
                }
            }, 50);
        }

        function restartAnimation() {
            const svg = document.getElementById('mainSvg');
            svg.pauseAnimations();
            svg.setCurrentTime(0);
            svg.unpauseAnimations();
            updateStatus();
        }

        function toggleAnimation() {
            const svg = document.getElementById('mainSvg');

            if (isPaused) {
                svg.unpauseAnimations();
                isPaused = false;
            } else {
                svg.pauseAnimations();
                isPaused = true;
            }
        }

        function changeSpeed(speed) {
            currentSpeed = speed;
            const duration = speeds[speed] / 1000;

            document.querySelectorAll('animateMotion').forEach(el => {
                el.setAttribute('dur', duration + 's');
            });

            // Data flow animations should match the main duration
            document.querySelectorAll('#dataFlow animate, #dataFlow animateMotion').forEach(el => {
                el.setAttribute('dur', duration + 's');
            });

            restartAnimation();
        }

        async function loadLogo() {
            try {
                const response = await fetch('/mnt/user-data/uploads/Odisha_Police_Logo.png');
                const blob = await response.blob();
                const reader = new FileReader();
                reader.onloadend = () => {
                    const base64 = reader.result;
                    document.getElementById('headerLogo').src = base64;
                    document.querySelectorAll('image[href*="Odisha_Police_Logo"]').forEach(img => {
                        img.setAttribute('href', base64);
                    });
                };
                reader.readAsDataURL(blob);
            } catch (e) {
                console.log('Using direct path');
            }
        }

        loadLogo();
        updateStatus();
    </script>
</body>

</html>
