    <text x="1385" y="245" text-anchor="middle" font-size="16" font-weight="bold" fill="#C62828">ଆଦର୍ଶ ଥାନା</text>
    <rect x="1355" y="340" width="80" height="80" fill="#37474F" rx="8" />
    <rect x="1360" y="345" width="70" height="70" fill="#263238" rx="6" />
    <rect x="1250" y="300" width="55" height="60" fill="#BBDEFB" stroke="#1565C0" stroke-width="3" rx="4" />
