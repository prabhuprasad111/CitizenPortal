    <ellipse cx="590" cy="350" rx="35" ry="40" fill="#66BB6A" />
    <ellipse cx="630" cy="350" rx="35" ry="40" fill="#66BB6A" />
    <rect x="980" y="380" width="20" height="70" fill="#6D4C41" rx="3" />
