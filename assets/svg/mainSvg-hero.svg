      <ellipse cx="219" cy="406" rx="10" ry="6" fill="#212121" />
      <ellipse cx="210" cy="340" rx="24" ry="30" fill="#42A5F5" />
      <path d="M 200,325 L 210,330 L 220,325" fill="#1976D2" />
      <circle cx="210" cy="335" r="2" fill="#1565C0" />
