        repeatCount="indefinite" />
    </path>
    <path d="M 22,5 Q 32,15 34,22" stroke="url(#khakiUniform)" stroke-width="11" fill="none" stroke-linecap="round">
      <animate attributeName="d" values="M 22,5 Q 32,15 34,22; M 22,5 Q 28,12 28,25; M 22,5 Q 32,15 34,22"
