<svg id="mainSvg" viewBox="0 0 1600 650" xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <filter id="mainShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="mainGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B0E0E6;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="skinTone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFDBAC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F1C27D;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="khakiUniform" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C9B382;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A89160;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1600" height="650" fill="url(#skyGrad)" />

  <g id="sun">
    <circle cx="1450" cy="100" r="50" fill="#FFD700" opacity="0.9">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="4s" repeatCount="indefinite" />
    </circle>
    <g opacity="0.6">
      <line x1="1450" y1="40" x2="1450" y2="10" stroke="#FFD700" stroke-width="4" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0 1450 100" to="360 1450 100" dur="20s"
          repeatCount="indefinite" />
      </line>
      <line x1="1510" y1="100" x2="1540" y2="100" stroke="#FFD700" stroke-width="4" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0 1450 100" to="360 1450 100" dur="20s"
          repeatCount="indefinite" />
      </line>
      <line x1="1500" y1="150" x2="1520" y2="170" stroke="#FFD700" stroke-width="4" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0 1450 100" to="360 1450 100" dur="20s"
          repeatCount="indefinite" />
      </line>
      <line x1="1400" y1="150" x2="1380" y2="170" stroke="#FFD700" stroke-width="4" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0 1450 100" to="360 1450 100" dur="20s"
          repeatCount="indefinite" />
      </line>
    </g>
  </g>

  <g opacity="0.8">
    <g id="cloud1">
