    </ellipse>
    <path d="M -8,44 L -14,52" stroke="#424242" stroke-width="12" stroke-linecap="round">
      <animate attributeName="d" values="M -8,44 L -14,52; M -8,44 L -18,52; M -8,44 L -14,52" dur="0.8s"
