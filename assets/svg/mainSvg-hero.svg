  <path id="requestPath" d="M 270,280 Q 800,200 1385,320" fill="none" stroke="none" />
  <path id="approvalPath" d="M 1385,320 Q 800,200 270,280" fill="none" stroke="none" />

  <g id="dataFlow">
    <g id="requestPacket">
      <circle cx="0" cy="0" r="12" fill="#2196F3" opacity="0" filter="url(#mainGlow)">
        <animate id="requestAnim" attributeName="opacity" values="0;0.9;0.9;0.9;0" dur="16s"
          keyTimes="0;0.05;0.2;0.35;0.4" repeatCount="indefinite" begin="2s" />
      </circle>
      <text x="0" y="-18" text-anchor="middle" font-size="10" fill="#1565C0" font-weight="bold" opacity="0">
        <animate attributeName="opacity" values="0;0.9;0.9;0.9;0" dur="16s" keyTimes="0;0.05;0.2;0.35;0.4"
          repeatCount="indefinite" begin="2s" />
        REQUEST
      </text>
      <animateMotion dur="16s" repeatCount="indefinite" begin="2s" keyPoints="0;0;0.5;1;1"
        keyTimes="0;0.05;0.2;0.35;0.4" calcMode="linear">
        <mpath xlink:href="#requestPath" href="#requestPath" />
      </animateMotion>
    </g>
    <g id="approvalPacket">
      <circle cx="0" cy="0" r="12" fill="#4CAF50" opacity="0" filter="url(#mainGlow)">
        <animate attributeName="opacity" values="0;0;0;0.9;0.9;0.9;0" dur="16s"
          keyTimes="0;0.5;0.55;0.7;0.85;0.9;1" repeatCount="indefinite" begin="2s" />
      </circle>
      <text x="0" y="6" text-anchor="middle" font-size="14" fill="white" font-weight="bold" opacity="0">
        <animate attributeName="opacity" values="0;0;0;0.9;0.9;0.9;0" dur="16s"
          keyTimes="0;0.5;0.55;0.7;0.85;0.9;1" repeatCount="indefinite" begin="2s" />✓</text>
      <text x="0" y="-18" text-anchor="middle" font-size="10" fill="#2E7D32" font-weight="bold" opacity="0">
        <animate attributeName="opacity" values="0;0;0;0.9;0.9;0.9;0" dur="16s"
          keyTimes="0;0.5;0.55;0.7;0.85;0.9;1" repeatCount="indefinite" begin="2s" />APPROVED</text>
      <animateMotion dur="16s" repeatCount="indefinite" begin="2s" keyPoints="0;0;0;0.5;1;1;1"
        keyTimes="0;0.5;0.55;0.7;0.85;0.9;1" calcMode="linear">
        <mpath xlink:href="#approvalPath" href="#approvalPath" />
      </animateMotion>
    </g>
    <g id="wifiWaves">
      <path d="M 250,270 Q 280,240 310,270" stroke="#4CAF50" stroke-width="3" fill="none" opacity="0.5"
        stroke-linecap="round">
        <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.5s" repeatCount="indefinite" />
      </path>
      <path d="M 235,285 Q 280,225 325,285" stroke="#4CAF50" stroke-width="3" fill="none" opacity="0.3"
        stroke-linecap="round">
        <animate attributeName="opacity" values="0.1;0.5;0.1" dur="2.5s" repeatCount="indefinite" begin="0.5s" />
      </path>
    </g>
  </g>

</svg>