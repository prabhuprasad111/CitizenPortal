<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · Citizen Portal | ନାଗରିକ ପୋର୍ଟାଲ୍</title>
  <meta name="description" content="Secure login for the Odisha Citizen Portal — bilingual Odia / English labels.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Oriya:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    rel="stylesheet">

  <link href="assets/img/Odisha_Police_Logo.png" rel="icon" sizes="any">

  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/login.css" rel="stylesheet">
</head>

<body class="login-page-body">
  <nav class="login-lang-bar" role="navigation" aria-label="Language">
    <a href="#" lang="en">English</a>
    <a href="#" lang="or">ଓଡ଼ିଆ</a>
  </nav>

  <main class="login-main-centre">
    <div class="login-card-shell">
      <svg class="login-patta-frame" viewBox="0 0 440 620" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="pattaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#c45a09" />
            <stop offset="50%" stop-color="#e9830f" />
            <stop offset="100%" stop-color="#b42318" />
          </linearGradient>
        </defs>
        <rect x="3" y="3" width="434" height="614" rx="20" fill="none" stroke="url(#pattaGrad)" stroke-width="2.2" />
        <path fill="none" stroke="url(#pattaGrad)" stroke-width="1.2" opacity="0.8"
          d="M22 22h52l10-11 10 11h52M22 596h52l10 11 10-11h52M22 22v52l-11 10 11 10M416 22v52l11 10-11 10" />
        <circle cx="40" cy="40" r="5" fill="none" stroke="url(#pattaGrad)" stroke-width="1.1" opacity="0.75" />
        <circle cx="400" cy="40" r="5" fill="none" stroke="url(#pattaGrad)" stroke-width="1.1" opacity="0.75" />
        <circle cx="40" cy="578" r="5" fill="none" stroke="url(#pattaGrad)" stroke-width="1.1" opacity="0.75" />
        <circle cx="400" cy="578" r="5" fill="none" stroke="url(#pattaGrad)" stroke-width="1.1" opacity="0.75" />
      </svg>

      <div class="login-card-inner">
        <div class="login-brand-row">
          <div class="login-konark-wheel-wrap">
            <!-- Wheel: konark.png — clockwise spin; tweak object-position if the chakra is off-center -->
            <div class="login-wheel-spin" role="img" aria-label="Konark Sun Temple wheel">
              <div class="login-wheel-rotator">
                <img class="login-wheel-img" src="assets/img/konark.png" alt="Konark Sun Temple — Dharma Chakra wheel"
                  width="400" height="400" decoding="async" fetchpriority="high">
              </div>
            </div>
          </div>

          <h1 class="login-heading">
            Welcome
            <span class="odia-stack" lang="or">ସ୍ୱାଗତ</span>
          </h1>
          <p class="login-sub">
            Odisha Citizen Portal · <span class="odia" lang="or">ଓଡ଼ିଶା ନାଗରିକ ପୋର୍ଟାଲ୍</span>
          </p>
        </div>

        <form class="login-form" action="#" method="post" autocomplete="on" novalidate>
          <div class="login-field">
            <label class="login-label" for="username">
              Username <span class="odia" lang="or">(ବ୍ୟବହାରକାରୀ ନାମ)</span>
            </label>
            <div class="login-input-wrap">
              <i class="bi bi-person-fill" aria-hidden="true"></i>
              <input class="login-input" type="text" id="username" name="username" required
                placeholder="Enter your username" spellcheck="false" autocapitalize="none">
            </div>
          </div>

          <div class="login-field">
            <label class="login-label" for="password">
              Password <span class="odia" lang="or">(ପାସ୍ୱାର୍ଡ)</span>
            </label>
            <div class="login-input-wrap">
              <i class="bi bi-shield-lock-fill" aria-hidden="true"></i>
              <input class="login-input login-input--password" type="password" id="password" name="password" required
                placeholder="Enter your password" autocomplete="current-password">
              <div class="login-password-actions">
                <button class="btn-toggle-password" type="button" id="togglePassword"
                  aria-label="Show password · ପାସ୍ୱାର୍ଡ ଦେଖାନ୍ତୁ" aria-pressed="false" aria-controls="password">
                  <i class="bi bi-eye-fill" aria-hidden="true"></i>
                </button>
              </div>
            </div>
          </div>

          <div class="login-meta">
            <label class="login-check">
              <input type="checkbox" id="remember" name="remember" value="1">
              <span>Remember me <span class="odia" lang="or">· ମନେରଖିବେ</span></span>
            </label>
            <a class="login-forgot" href="#">Forgot password? <span class="odia" lang="or">ପାସ୍ୱାର୍ଡ ଭୁଲି
                ଗଲେ?</span></a>
          </div>

          <button type="submit" class="btn-login-submit">
            Sign in <span class="odia" lang="or">· ଲଗଇନ୍ କରନ୍ତୁ</span>
          </button>
        </form>

        <div class="login-footer-links">
          <a href="index.html"><i class="bi bi-arrow-left-short" aria-hidden="true"></i> Back to home</a>
          · <span class="odia" lang="or">ମୁଖ୍ୟ ପୃଷ୍ଠାକୁ ଫେରିଆସନ୍ତୁ</span>
        </div>
      </div>
    </div>
  </main>

  <footer class="login-saura-footer">
    <img class="login-bottom-art" src="assets/img/bottom.png" alt="Odisha Saura folk art border" width="2400"
      height="400" decoding="async" loading="lazy">
  </footer>

  <script>
    (function () {
      var input = document.getElementById("password");
      var btn = document.getElementById("togglePassword");
      if (!input || !btn) return;
      var icon = btn.querySelector("i");

      function setPasswordVisible(reveal) {
        input.type = reveal ? "text" : "password";
        btn.setAttribute("aria-pressed", reveal ? "true" : "false");
        btn.setAttribute(
          "aria-label",
          reveal ? "Hide password · ପାସ୍ୱାର୍ଡ ଲୁଚାନ୍ତୁ" : "Show password · ପାସ୍ୱାର୍ଡ ଦେଖାନ୍ତୁ"
        );
        if (icon) {
          icon.classList.toggle("bi-eye-fill", !reveal);
          icon.classList.toggle("bi-eye-slash-fill", reveal);
        }
      }

      btn.addEventListener("click", function () {
        setPasswordVisible(input.type === "password");
      });

      btn.addEventListener("keydown", function (e) {
        if (e.key === " " || e.key === "Enter") {
          e.preventDefault();
          btn.click();
        }
      });
    })();
  </script>
</body>

</html>
